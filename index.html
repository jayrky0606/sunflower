<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나랑 결혼해줄래? 💕</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
  background:linear-gradient(135deg,#ffd6e7,#fff0f5);
  font-family:Arial,sans-serif;overflow:hidden
}
.container{
  width:90%;max-width:420px;padding:40px 25px;text-align:center;
  background:rgba(255,255,255,.9);border-radius:30px;
  box-shadow:0 10px 40px rgba(0,0,0,.12)
}
.heart{font-size:70px;animation:beat 1s infinite}
h1{font-size:30px;color:#ff4f81;margin:15px 0 35px}
.buttons{display:flex;justify-content:center;gap:15px}
button{
  border:0;border-radius:15px;padding:15px 30px;font-size:18px;
  font-weight:bold;cursor:pointer;touch-action:manipulation;transition:.2s
}
#yes{background:#ff5c8a;color:#fff}
#no{background:#ddd;color:#555}
button:active{transform:scale(.92)}
#result{display:none}
#result .big-heart{font-size:80px;animation:beat 1s infinite}
#result h2{color:#ff4081;font-size:28px;line-height:1.5}
#result p{color:#777;font-size:16px}
.message{
  margin-top:22px;color:#ff4f81;font-size:20px;font-weight:bold;
  animation:pop .3s ease
}
.floating-heart{
  position:fixed;bottom:-30px;font-size:25px;
  animation:floatUp 4s linear forwards;pointer-events:none
}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-110vh);opacity:0}}
</style>
</head>
<body>
<div class="container">

  <div id="question">
    <div class="heart">💗</div>
    <h1>나랑 결혼해줄래?</h1>

    <div class="buttons">
      <button id="yes">YES 💕</button>
      <button id="no">NO</button>
    </div>

    <div id="noMessage"></div>
  </div>

  <div id="result">
    <div class="big-heart">💖</div>
    <h2>김라연 사랑해<br>5년 후에 결혼하자💕</h2>
    <p>우리 오래오래 행복하자 🥰</p>
  </div>

</div>

<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const question=document.getElementById("question");
const result=document.getElementById("result");
const noMessage=document.getElementById("noMessage");

no.addEventListener("click",()=>{
  no.style.display="none";
  noMessage.innerHTML='<div class="message">응 NO는 못눌러 ㅋ 😏💕</div>';
});

yes.addEventListener("click",()=>{
  question.style.display="none";
  result.style.display="block";

  for(let i=0;i<30;i++) createHeart();
});

function createHeart(){
  const heart=document.createElement("div");
  heart.className="floating-heart";
  heart.innerHTML=["💗","💕","💖","❤️","💓"][Math.floor(Math.random()*5)];
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(3+Math.random()*3)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}
</script>
</body>
</html>
